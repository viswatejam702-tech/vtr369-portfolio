<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="512" height="512">
  <defs>
    <radialGradient id="ambGlow" cx="50%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#ff6a00" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#ff6a00" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ff6a00" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="35%" stop-color="#ffb066" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#ff6a00" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ff6a00" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="facetWhite" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c9c9c9" />
    </linearGradient>
    <linearGradient id="facetOrange" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb066" />
      <stop offset="55%" stop-color="#ff6a00" />
      <stop offset="100%" stop-color="#b83d00" />
    </linearGradient>
    <filter id="glowDrop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ff6a00" flood-opacity="0.4" />
    </filter>
  </defs>

  

  <!-- Ambient Underglow -->
  <ellipse cx="100" cy="155" rx="52" ry="12" fill="url(#ambGlow)" />

  <!-- Extruded 3D Layers -->
  <g filter="url(#glowDrop)">
    
      <g transform="translate(32.36, 59.24)" fill="#0d0d0d" stroke="#ff6a00" stroke-width="0.8" stroke-opacity="0.03">
        <polygon points="6,10 31,10 50,58 50,92" />
        <polygon points="94,10 69,10 50,58 50,92" />
      </g>
      <g transform="translate(33.620000000000005, 58.58)" fill="#2a1100" stroke="#ff6a00" stroke-width="0.8" stroke-opacity="0.09">
