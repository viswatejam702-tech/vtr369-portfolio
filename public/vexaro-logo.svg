        <polygon points="94,10 69,10 50,58 50,92" />
      </g>
      <g transform="translate(43.7, 53.3)" fill="#2a1100" stroke="#ff6a00" stroke-width="0.8" stroke-opacity="0.59">
        <polygon points="6,10 31,10 50,58 50,92" />
        <polygon points="94,10 69,10 50,58 50,92" />
      </g>
