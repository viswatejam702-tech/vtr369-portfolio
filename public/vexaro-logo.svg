      </g>
      <g transform="translate(47.48, 51.32)" fill="#0d0d0d" stroke="#ff6a00" stroke-width="0.8" stroke-opacity="0.78">
        <polygon points="6,10 31,10 50,58 50,92" />
        <polygon points="94,10 69,10 50,58 50,92" />
      </g>
      <g transform="translate(48.74, 50.66)" fill="#2a1100" stroke="#ff6a00" stroke-width="0.8" stroke-opacity="0.84">
        <polygon points="6,10 31,10 50,58 50,92" />
        <polygon points="94,10 69,10 50,58 50,92" />
      </g>

    <!-- Top Cap (Front Facets) -->
    <g transform="translate(50, 50)">
      <polygon points="6,10 31,10 50,58 50,92" fill="url(#facetWhite)" />
      <polygon points="94,10 69,10 50,58 50,92" fill="url(#facetOrange)" />
      <!-- Specular Highlights -->
      <polygon points="6,10 31,10 50,58" fill="#ffffff" opacity="0.4" />
      <polygon points="94,10 69,10 50,58" fill="#ffffff" opacity="0.2" />
    </g>

    <!-- Notch Spark Aura & Core -->
    <circle cx="100" cy="84" r="9" fill="url(#sparkGlow)" />
    <circle cx="100" cy="84" r="4.5" fill="#ffffff">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="2.4s" repeatCount="indefinite" />
    </circle>
  </g>
